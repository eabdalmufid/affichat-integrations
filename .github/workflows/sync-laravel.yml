name: Sync Laravel Repository

on:
  push:
    branches:
      - main
    paths:
      - 'affichat-laravel/**'
    tags:
      - 'laravel-v*'
      - 'v*'
  workflow_dispatch:

jobs:
  split-laravel:
    name: Subtree Split to Laravel Repo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_LARAVEL_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "AffiChat Bot"
          git config --global user.email "admin@affidev.com"

      - name: Push Subtree to Standalone Laravel Repo
        env:
          DEST_TOKEN: ${{ secrets.SYNC_LARAVEL_TOKEN }}
        run: |
          # Split folder affichat-laravel into a temporary branch
          git subtree split --prefix=affichat-laravel -b standalone-laravel

          # Push to the standalone repo main branch (even if empty)
          git push -f https://eabdalmufid:${DEST_TOKEN}@github.com/eabdalmufid/affichat-laravel.git standalone-laravel:main
