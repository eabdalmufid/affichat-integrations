name: Release WordPress Plugin

on:
  push:
    tags:
      - 'wp-v*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Run Plugin Tests
        run: php affichat-wordpress/tests/test-plugin.php

      - name: Package Plugin ZIP
        run: zip -r affichat-wordpress.zip affichat-wordpress -x "affichat-wordpress/tests/*"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AffiChat WordPress Plugin ${{ github.ref_name }}"
          body: |
            ### Apa yang Baru di v1.0.11

            - **Desain Tab Alat & Kontak Seragam & Modern** - Menyelaraskan tata letak visual, header kartu, dan badges (*Buku Kontak CRM*, *Peta Interaktif*, *Survei Otomatis*, *Multi-Nomor*) setara dengan tab lainnya sesuai standar tema modern AffiChat.
            - **Tombol Reset Per-Field & Form Lengkap** - Menambahkan tombol reset individual per-field dan tombol reset seksi/form dengan dialog konfirmasi modern, animasi pulse highlight, dan notifikasi toast instan.
            - **Tata Letak Responsif Mobile (Antislop)** - Penataan form koordinat GPS toko menggunakan grid responsif yang otomatis menyesuaikan pada layar smartphone tanpa terpotong atau meluap.
            - **Chip Variabel Siaran Cepat** - Menambahkan tombol sisip variabel instan (`{store_name}`, `{site_name}`, `{date}`, `{time}`) pada formulir siaran cepat WhatsApp.
            - **Penyimpanan Pengaturan Terpisah** - Pemisahan aksi penyimpanan antar kartu agar preferensi sinkronisasi kontak dan survei kepuasan tidak saling menimpa.

            ### Cara Install / Perbarui

            Unduh **`affichat-wordpress.zip`** di bawah ini, lalu buka `wp-admin > Plugins > Add New Plugin > Upload Plugin`.

            > **Catatan:** Jangan unduh `Source code (zip)` bawaan GitHub - file tersebut berisi seluruh monorepo. Hanya unduh file aset **`affichat-wordpress.zip`**.

            ### Kebutuhan Sistem

            - WordPress 5.8 atau lebih baru
            - PHP 7.4 atau lebih baru
            - WooCommerce 5.0+ (opsional)
          files: affichat-wordpress.zip
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
