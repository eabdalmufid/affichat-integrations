name: Release WordPress Plugin

on:
  push:
    tags:
      - 'wp-v*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Run Plugin Tests
        run: php affichat-wordpress/tests/test-plugin.php

      - name: Package Plugin ZIP
        run: zip -r affichat-wordpress.zip affichat-wordpress -x "affichat-wordpress/tests/*"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AffiChat WordPress Plugin ${{ github.ref_name }}"
          body: |
            ### Apa yang Baru di v1.0.10

            - **Kirim Gambar Produk WooCommerce** - Notifikasi pesanan selesai (`completed`) kini dapat menyertakan foto produk utama secara otomatis melalui WhatsApp (`send_image`).
            - **Kirim Pin Lokasi Toko (GPS)** - Bagikan pin peta interaktif WhatsApp lokasi fisik toko langsung dari tab Alat & Kontak WP-Admin (`send_location`).
            - **Survei & Polling Kepuasan Pelanggan** - Otomatis jadwalkan polling interaktif WhatsApp pasca pesanan selesai dengan delay hari yang dapat disesuaikan (`send_poll`).
            - **Sinkronisasi Kontak Toko** - Selaraskan daftar pelanggan WooCommerce ke buku kontak AffiChat WhatsApp dalam satu klik atau otomatis saat checkout (`sync_contact`).
            - **Siaran Cepat (Quick Broadcast)** - Kirim pengumuman atau promo sekaligus ke daftar nomor WhatsApp dengan dukungan caption dan foto dari WP-Admin.
            - **Notifikasi Status On-Hold & Refunded** - Dukungan pesan otomatis baru untuk pesanan yang ditahan atau dikembalikan dananya, serta tombol kirim ulang WhatsApp di detail order WooCommerce.
            - **Modal Detail & Pembaruan Andal** - Tampilan detail plugin kini menampilkan changelog terformat rapi dengan update otomatis yang stabil.

            ### Cara Install / Perbarui

            Unduh **`affichat-wordpress.zip`** di bawah ini, lalu buka `wp-admin > Plugins > Add New Plugin > Upload Plugin`.

            > **Catatan:** Jangan unduh `Source code (zip)` bawaan GitHub - file tersebut berisi seluruh monorepo. Hanya unduh file aset **`affichat-wordpress.zip`**.

            ### Kebutuhan Sistem

            - WordPress 5.8 atau lebih baru
            - PHP 7.4 atau lebih baru
            - WooCommerce 5.0+ (opsional)
          files: affichat-wordpress.zip
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
