name: Release WordPress Plugin

on:
  push:
    tags:
      - 'wp-v*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Run Plugin Tests
        run: php affichat-wordpress/tests/test-plugin.php

      - name: Package Plugin ZIP
        run: zip -r affichat-wordpress.zip affichat-wordpress -x "affichat-wordpress/tests/*"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AffiChat WordPress Plugin ${{ github.ref_name }}"
          body: |
            ## AffiChat for WordPress & WooCommerce

            ### Apa yang Baru di Versi Ini

            - **Modal Detail Plugin** — tampilan "Lihat detail" kini menampilkan informasi versi, changelog, dan banner gambar dengan benar.
            - **Changelog Terformat** — teks changelog sekarang dirender sebagai HTML (heading, list, blockquote) bukan teks mentah.
            - **Banner Plugin** — gambar banner landscape resmi AffiChat kini muncul di header modal detail.
            - **Link Detail di Action Links** — tombol "Detail" baru tersedia langsung di kolom plugin tanpa perlu scroll ke bawah.
            - **Fix Auto-Update** — proses "Perbarui Sekarang" tidak lagi menghapus folder plugin setelah update.

            ### Cara Instalasi / Pembaruan Manual

            Unduh file **`affichat-wordpress.zip`** di bawah ini, lalu buka `wp-admin > Plugins > Add New Plugin > Upload Plugin`.

            > **Penting:** Jangan unduh `Source code (zip)` bawaan GitHub karena berisi seluruh monorepo. Gunakan hanya `affichat-wordpress.zip` di atas.

            ### Syarat Sistem

            - WordPress 5.8 atau lebih baru
            - PHP 7.4 atau lebih baru
            - WooCommerce 5.0+ (opsional, untuk notifikasi pesanan)
          files: affichat-wordpress.zip
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

