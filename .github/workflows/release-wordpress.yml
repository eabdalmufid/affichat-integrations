name: Release WordPress Plugin

on:
  push:
    tags:
      - 'wp-v*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Run Plugin Tests
        run: php affichat-wordpress/tests/test-plugin.php

      - name: Package Plugin ZIP
        run: zip -r affichat-wordpress.zip affichat-wordpress -x "affichat-wordpress/tests/*"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AffiChat WordPress Plugin ${{ github.ref_name }}"
          body: |
            ### Fitur & Perbaikan

            - **Tampilan Modal Detail** - modal "Lihat detail" kini menampilkan banner, ikon, deskripsi lengkap, tab Changelog yang terformat rapi, dan informasi versi yang akurat.
            - **Changelog Terformat** - teks changelog dirender sebagai HTML dengan heading, daftar bullet, dan blockquote. Tidak lagi tampil sebagai teks mentah.
            - **Banner Baru** - gambar banner landscape resmi AffiChat (gelap, bersih, profesional) kini tampil di bagian atas modal detail plugin.
            - **Update Otomatis Stabil** - proses "Perbarui Sekarang" tidak lagi menghapus folder plugin. Tidak perlu reinstall manual setelah update.
            - **Link Detail di Kolom Plugin** - tombol "Detail" tersedia langsung di action links tanpa perlu scroll ke baris kedua.

            ### Cara Install / Perbarui

            Unduh **`affichat-wordpress.zip`** di bawah ini, lalu buka `wp-admin > Plugins > Add New Plugin > Upload Plugin`.

            > **Catatan:** Jangan unduh `Source code (zip)` bawaan GitHub - file itu berisi seluruh monorepo. Hanya `affichat-wordpress.zip` yang perlu diunduh.

            ### Kebutuhan Sistem

            - WordPress 5.8 atau lebih baru
            - PHP 7.4 atau lebih baru
            - WooCommerce 5.0+ (opsional)
          files: affichat-wordpress.zip
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
