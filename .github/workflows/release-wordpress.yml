name: Release WordPress Plugin

on:
  push:
    tags:
      - 'wp-v*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Run Plugin Tests
        run: php affichat-wordpress/tests/test-plugin.php

      - name: Package Plugin ZIP
        run: zip -r affichat-wordpress.zip affichat-wordpress -x "affichat-wordpress/tests/*"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AffiChat WordPress Plugin ${{ github.ref_name }}"
          body: |
            ### 📦 Instalasi & Pembaruan WordPress
            Unduh file **`affichat-wordpress.zip`** di bawah ini untuk menginstal atau memperbarui plugin secara manual di WordPress (`wp-admin > Plugins > Add New > Upload Plugin`).

            > ⚠️ **PENTING:**
            > Jangan unduh **`Source code (zip)`** bawaan GitHub di bawah, karena file tersebut mengunduh seluruh isi monorepo (termasuk Laravel, n8n, SDK). File resmi khusus WordPress yang siap pakai adalah **`affichat-wordpress.zip`**.
          files: affichat-wordpress.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

