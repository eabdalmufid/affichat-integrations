name: Release WordPress Plugin

on:
  push:
    tags:
      - 'wp-v*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Run Plugin Tests
        run: php affichat-wordpress/tests/test-plugin.php

      - name: Package Plugin ZIP
        run: zip -r affichat-wordpress.zip affichat-wordpress -x "affichat-wordpress/tests/*"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: affichat-wordpress.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
